<!doctype html>
<html lang="es-CL">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#050810" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#F7F6F3" media="(prefers-color-scheme: light)" />

    <title>Tenri Booking · Reserva tu hora en barberías y salones</title>
    <meta
      name="description"
      content="Directorio de barberías, salones de belleza y centros de estética con reserva online. Elige tienda, servicio y hora libre, sin llamar por teléfono."
    />
    <link rel="canonical" href="https://booking.tenri.cl/" />
    <meta name="robots" content="index, follow, max-image-preview:large" />

    <!-- Tarjeta al compartir. Ojo: WhatsApp, Facebook y LinkedIn leen el
         HTML crudo sin ejecutar JS, así que ven SIEMPRE estas etiquetas,
         no las que useSeo pone por ruta. Para una tarjeta por tienda
         haría falta prerender o SSR. -->
    <meta property="og:site_name" content="Tenri Booking" />
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="es_CL" />
    <meta property="og:url" content="https://booking.tenri.cl/" />
    <meta property="og:title" content="Tenri Booking · Reserva tu hora en barberías y salones" />
    <meta
      property="og:description"
      content="Barberías, salones y centros de estética con sus horas libres a la vista. Reserva online en un minuto."
    />
    <meta property="og:image" content="https://booking.tenri.cl/og-tenri.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Sillón de barbero en una barbería de ladrillo" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Tenri Booking · Reserva tu hora en barberías y salones" />
    <meta
      name="twitter:description"
      content="Barberías, salones y centros de estética con sus horas libres a la vista."
    />
    <meta name="twitter:image" content="https://booking.tenri.cl/og-tenri.jpg" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Fuentes aquí y no como @import en el CSS: el @import bloquea el
         primer render hasta resolver la hoja remota. -->
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23050810'/%3E%3Ctext x='50%25' y='54%25' text-anchor='middle' dominant-baseline='middle' font-family='Georgia,serif' font-size='18' font-weight='700' fill='%2310b981'%3ET%3C/text%3E%3C/svg%3E" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
